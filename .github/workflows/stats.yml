name: Telegram Stats

on:
  schedule:
    # Минута 19, а не 0: в начале часа у GitHub пик нагрузки на планировщик,
    # запуски там стабильно опаздывают на 5-30 минут и иногда теряются.
    - cron: '19 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-stats
  queue: max

jobs:
  run-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      # Версии зафиксированы: без пинов каждый прогон тянет последние релизы,
      # и мажорное обновление может молча сломать рабочий скрипт.
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Run stats
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python stats.py
